    <!-- Each page sets its own title, description, canonical, and social metadata. -->

    <!-- Open Graph (shared for all pages) -->

    <meta property="og:site_name" content="Maksudbek Dehqonaliyev" />
    <meta property="og:image" content="https://www.dehkonaliev.uz/favicon/favicon-1200x630.jpg" />
    <meta property="og:image:type" content="image/jpeg" />

    <!-- Structured data: Person and WebSite -->

        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://www.dehkonaliev.uz/#person",
            "name": "Maksudbek Dehqonaliyev",
            "alternateName": [
              "Maqsudjon Dehqonaliyev",
              "Maksudbek Dehkonaliev",
              "Maqsudbek Dehqonaliyev"
            ],
            "url": "https://www.dehkonaliev.uz/",
            "jobTitle": "Junior Backend Developer",
            "description": "Backend developer specializing in Python, Django, Django REST Framework, FastAPI, and PostgreSQL. Also builds web and mobile apps and Telegram bots.",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Tashkent",
              "addressCountry": "UZ"
            },
            "knowsAbout": [
              "Python",
              "Django",
              "Django REST Framework",
              "FastAPI",
              "PostgreSQL",
              "REST APIs",
              "Docker",
              "Telegram bots"
            ],
            "sameAs": [
              "https://github.com/YOUR_USERNAME",
              "https://www.linkedin.com/in/YOUR_USERNAME",
              "https://t.me/YOUR_USERNAME"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://www.dehkonaliev.uz/#website",
            "url": "https://www.dehkonaliev.uz/",
            "name": "Maksudbek Dehqonaliyev",

        ]

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Theme (light/dark) -->
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("theme");
          const dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", dark ? "#0F172A" : "#F5F7FA");
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
